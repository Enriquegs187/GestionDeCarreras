<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Área Personal del Promotor</title>
  <link rel="icon" href="/img/montanas.png">

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
</head>

<body>
<header class="header">
  <div class="logo">
    <a href="/"><img src="/img/logo.png" alt="Gestión de MoRMaS"></a>
  </div>
  <div class="accesos">
    <div class="loggeduser" th:object="${session}">
      <p th:if="*{user == null}">
        No autenticado <a href="/login/participante" th:href="@{/login/participante}">Entrar</a>
      </p>
      <p th:unless="*{user == null}">
                <span th:if="*{user.tipoUsuario == 'promotor'}">
                    <a href="/promotor/index" th:href="@{/promotor/index}">Página principal</a>
                </span>
        <span th:if="*{user.tipoUsuario == 'participante'}">
                    <a href="/participante/index" th:href="@{/participante/index}">Página principal</a>
                </span>
        <span>Autenticado como <span th:text="*{user.username}"></span></span>
        <a href="/logout" th:href="@{/logout}" class="access-link-logout">Cerrar Sesión</a>
      </p>
    </div>
  </div>
</header>

<section class="hero" style="margin-top: -25px">
  <div class="competiciones">
    <h1>Área Personal del Promotor</h1>
    <br>
    <div th:if="${session.promotor != null}">
      <h2>Información del Promotor</h2>
      <table class="table table-striped">
        <tbody>
        <tr>
          <th>Nombre</th>
          <td><span th:text="${session.promotor.nombre}"></span></td>
        </tr>
        <tr>
          <th>DNI</th>
          <td><span th:text="${session.promotor.dni}"></span></td>
        </tr>
        <tr>
          <th>Organización</th>
          <td><span th:text="${session.promotor.nombreOrganizacion}"></span></td>
        </tr>
        <tr>
          <th>Email</th>
          <td><span th:text="${session.promotor.email}"></span></td>
        </tr>
        <tr>
          <th>Teléfono</th>
          <td><span th:text="${session.promotor.telefono}"></span></td>
        </tr>
        <tr>
          <th></th>
          <td><a class="btn btn-warning" th:href="@{/promotor/update/{dni}(dni=${promotor.dni})}">Editar</a></td>
        </tr>
        </tbody>
      </table>
    </div>

    <div th:unless="${session.promotor != null}">
      <p>No se pudo cargar la información del promotor. Por favor, vuelva a iniciar sesión.</p>
    </div>

    <a class="btn btn-info mt-4" th:href="@{/promotor/index}">Volver</a>
  </div>
</section>

</body>
</html>
