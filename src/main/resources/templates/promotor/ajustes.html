<h2>Datos del Promotor</h2>
<div class="form-group">
  <label for="nombre">Nombre:</label>
  <input type="text" id="nombre" class="form-control" value="${promotor.nombre}" readonly>
</div>
<div class="form-group">
  <label for="nombreOrganizacion">Nombre de la Organización:</label>
  <input type="text" id="nombreOrganizacion" class="form-control" value="${promotor.nombreOrganizacion}" readonly>
</div>
<div class="form-group">
  <label for="email">Correo Electrónico:</label>
  <input type="email" id="email" class="form-control" value="${promotor.email}" readonly>
</div>
<div class="form-group">
  <label for="telefono">Teléfono:</label>
  <input type="tel" id="telefono" class="form-control" value="${promotor.telefono}" readonly>
</div>
<a href="/promotor/actualizar" class="btn btn-primary">Actualizar datos</a>
