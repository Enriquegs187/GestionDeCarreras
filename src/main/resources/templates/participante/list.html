<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Participantes</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="/img/montanas.png">

    <!-- Estilos -->
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css" />

</head>
<body>
<header class="header">
    <div class="logo">
        <a href="/"><img src="/img/logo.png" alt="Gestión de MoRMaS"></a>
    </div>
    <div class="accesos">
        <div class="loggeduser" th:object="${session}">
            <p th:if="*{user == null}">
                No autenticado <a href="/login/participante" th:href="@{/login/participante}">Entrar</a>
            </p>
            <p th:unless="*{user == null}">
                <span th:if="*{user.tipoUsuario == 'promotor'}">
                    <a href="/promotor/index" th:href="@{/promotor/index}">Página principal</a>
                </span>
                <span th:if="*{user.tipoUsuario == 'participante'}">
                    <a href="/participante/index" th:href="@{/participante/index}">Página principal</a>
                </span>
                <span>Autenticado como <span th:text="*{user.username}"></span></span>
                <a href="/logout" th:href="@{/logout}" class="access-link-logout">Cerrar Sesión</a>
            </p>
        </div>
    </div>
</header>

<section class="hero">
    <div class="competiciones">
        <h1>Lista de Participantes</h1>
        <table id="tablaParticipantes" class="table table-striped">
            <thead>
            <tr>
                <th>DNI</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Categoría</th>
                <th>Fecha de nacimiento</th>
                <th>Email</th>
                <th>Método de pago</th>
                <th>Editar</th>
                <th>Borrar</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="participante : ${participantes}">
                <td th:text="${participante.dni}"></td>
                <td th:text="${participante.nombre}"></td>
                <td th:text="${participante.apellido}"></td>
                <td th:text="${participante.sexo}"></td>
                <td th:text="${participante.fechaNacimiento}"></td>
                <td th:text="${participante.email}"></td>
                <td th:text="${participante.metodoDePago}"></td>
                <td>
                    <a class="btn btn-warning" th:href="@{/participante/update/{dni}(dni=${participante.dni})}">Editar</a>
                </td>
                <td>
                    <a class="btn btn-danger"
                       th:href="@{/participante/confirm-delete/{dni}(dni=${participante.dni})}">
                        Borrar
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
        <a class="btn btn-success" href="add">Añadir participante</a>
        <br><br>
        <a class="btn btn-info" href="/promotor/index">Volver</a>
    </div>
</section>
</body>
</html>
