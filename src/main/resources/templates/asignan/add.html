<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Asignar voluntario</title>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/vnd.icon" href="/img/montanas.png">
  <link rel="stylesheet"
        href="/css/style.css"/>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
</head>
<body>
<header class="header">
  <div class="logo">
    <a href="/"><img src="/img/logo.png" alt="Gestión de MoRMaS"></a>
  </div>
  <div class="accesos">
    <div class="loggeduser" th:object="${session}">
      <p th:if="*{user == null}">
        No autenticado <a href="/login/participante" th:href="@{/login/participante}">Entrar</a>
      </p>
      <p th:unless="*{user == null}">
                <span th:if="*{user.tipoUsuario == 'promotor'}">
                    <a href="/promotor/index" th:href="@{/promotor/index}">Página principal</a>
                </span>
        <span th:if="*{user.tipoUsuario == 'participante'}">
                    <a href="/participante/index" th:href="@{/participante/index}">Página principal</a>
                </span>
        <span>Autenticado como <span th:text="*{user.username}"></span></span>
        <a href="/logout" th:href="@{/logout}" class="access-link-logout">Cerrar Sesión</a>
      </p>
    </div>
  </div>
</header>
<section class="hero">
  <div class="competiciones">
<h2>Asignar voluntario a punto de control <span th:text="${localizacion}"></span></h2>

    <form th:action="@{/asignan/add}" th:object="${asignan}" method="post">

  <table >
    <tr>
      <td><label>Voluntario:</label></td>
      <td>
        <select th:field="*{dniVoluntario}" class="form-control" required>
          <option value="" disabled selected>Selecciona un voluntario</option>
          <option th:each="vol : ${voluntarios}"
                  th:value="${vol.dni}"
                  th:text="${vol.nombre + ' ' + vol.apellido}">Nombre</option>
        </select>
      </td>
    </tr>
    <tr>
      <td></td>
      <td><input type="hidden" th:field="*{codPuntoControl}" /></td>
    </tr>
    <tr>
      <td colspan="2">
        <input type="submit" class="btn btn-success" value="Asignar" />
      </td>
    </tr>
  </table>
</form>
<a class="btn btn-secondary" th:href="@{/puntoControl/porCarrera/{codCarrera}(codCarrera=${codCarrera}, codCompeticion=${codCompeticion})}">Cancelar</a>
  </div>
</section>
</body>
</html>
