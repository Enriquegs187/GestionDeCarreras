<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear nuevo sponsor</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="/img/montanas.png">

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/add.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"/>
</head>
<body>
<header class="header">
    <div class="logo">
        <a href="/"><img src="/img/logo.png" alt="Gestión de MoRMaS"></a>
    </div>
    <div class="accesos">
        <div class="loggeduser" th:object="${session}">
            <p th:if="*{user == null}">
                No autenticado <a href="/login/participante" th:href="@{/login/participante}">Entrar</a>
            </p>
            <p th:unless="*{user == null}">
                <span th:if="*{user.tipoUsuario == 'promotor'}">
                    <a href="/promotor/index" th:href="@{/promotor/index}">Página principal</a>
                </span>
                <span th:if="*{user.tipoUsuario == 'participante'}">
                    <a href="/participante/index" th:href="@{/participante/index}">Página principal</a>
                </span>
                <span>Autenticado como <span th:text="*{user.username}"></span></span>
                <a href="/logout" th:href="@{/logout}" class="access-link-logout">Cerrar Sesión</a>
            </p>
        </div>
    </div>
</header>
<section class="hero">
    <div class="competiciones">
        <h2>Nuevo sponsor</h2>
        <form action="#" th:action="@{/sponsor/add}"
              th:object="${sponsor}" method="post">
            <table>
                <tr>
                    <td><input type="text" th:field="*{cod}" readonly="readonly" hidden="true" /></td>
                </tr>
                <tr>
                    <td><label>Nombre</label></td>
                    <td><input type="text" th:field="*{nombre}" required/></td>
                </tr>
                <tr class="addbtn">
                    <td colspan="2"><input type="submit" value="Añadir sponsor" class="btn btn-success"/></td>
                </tr>
                <tr>
                    <td><a class="btn btn-info" href="../sponsor/list">Volver</a></td>
                </tr>
            </table>
        </form>
    </div>
</section>
</body>
</html>
