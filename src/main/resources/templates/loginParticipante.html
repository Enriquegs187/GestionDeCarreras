<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8"/>
    <title>Login Participante</title>
    <link rel="icon" href="/img/montanas.png">

    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}"/>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/latest/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<header class="header">
    <div class="logo">
        <a href="/"><img src="/img/logo.png" alt="Gestión de MoRMaS"></a>
    </div>
    <div class="accesos">
        <div class="loggeduser" th:object="${session}">
            <p th:if="*{user == null}">
                No autenticado <a href="/login/participante" th:href="@{/login/participante}">Entrar</a>
            </p>
            <p th:unless="*{user == null}">
                <span th:if="*{user.tipoUsuario == 'promotor'}">
                    <a href="/promotor/index" th:href="@{/promotor/index}">Página principal</a>
                </span>
                <span th:if="*{user.tipoUsuario == 'participante'}">
                    <a href="/participante/index" th:href="@{/participante/index}">Página principal</a>
                </span>
                <span>Autenticado como <span th:text="*{user.username}"></span></span>
                <a href="/logout" th:href="@{/logout}" class="access-link-logout">Cerrar Sesión</a>
            </p>
        </div>
    </div>
</header>
<div layout:fragment="content" class="container mt-5">
    <h2>Acceso para Participantes</h2>
    <p class="text-muted">Introduce tus credenciales de participante para acceder.</p>

    <form th:action="@{/login/participante}" th:object="${user}" method="post" class="form-group">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div class="mb-3">
            <label for="username" class="form-label">DNI:</label>
            <input type="text" th:field="*{username}" class="form-control" id="username" maxlength="50" required/>
            <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña:</label>
            <input type="password" th:field="*{password}" class="form-control" id="password" maxlength="50" required/>
            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></div>
        </div>

        <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
    </form>
    <a class="btn btn-secondary" th:href="@{/participante/add}">¿No tienes cuenta? Regístrate</a>

</div>
</body>

</html>
